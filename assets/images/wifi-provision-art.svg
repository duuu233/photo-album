<svg width="600" height="240" viewBox="0 0 600 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A5A"/>
      <stop offset="1" stop-color="#FF5A1E"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF7A3A" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF7A3A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 连线：手机 → 设备（蓝牙下发配置）→ 云（设备经 WiFi 上云） -->
  <path d="M152 120H232" stroke="#FFB48A" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14"/>
  <path d="M368 120H448" stroke="#FFB48A" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 14"/>
  <path d="M220 110L232 120L220 130" stroke="#FFB48A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M436 110L448 120L436 130" stroke="#FFB48A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 手机 -->
  <circle cx="92" cy="120" r="88" fill="url(#halo)"/>
  <circle cx="92" cy="120" r="56" fill="url(#orb)"/>
  <rect x="74" y="92" width="36" height="58" rx="7" stroke="#FFFFFF" stroke-width="5"/>
  <path d="M86 140H98" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

  <!-- 相框设备（主角，稍大） -->
  <circle cx="300" cy="120" r="108" fill="url(#halo)"/>
  <circle cx="300" cy="120" r="66" fill="url(#orb)"/>
  <rect x="268" y="94" width="64" height="52" rx="7" stroke="#FFFFFF" stroke-width="5"/>
  <path d="M276 136L292 119L304 130L313 122L324 136" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="314" cy="108" r="5" fill="#FFFFFF"/>
  <path d="M290 158H310" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>

  <!-- 云 -->
  <circle cx="508" cy="120" r="88" fill="url(#halo)"/>
  <circle cx="508" cy="120" r="56" fill="url(#orb)"/>
  <path d="M486 139H531C539.3 139 546 132.3 546 124C546 116.4 540.4 110.1 533.1 109.1C531 99.8 522.7 93 512.8 93C503.6 93 495.8 98.9 493.1 107.2C484.5 107.9 478 115 478 123.6C478 131 482 137.4 486 139Z" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
  <path d="M500 125.5C504.9 120.8 512.6 120.8 517.5 125.5" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="508.8" cy="131.5" r="3.4" fill="#FFFFFF"/>
</svg>
