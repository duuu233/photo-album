<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>乾融｜产业数字金融运营平台 · 操作工作台（优化版）</title>
<!--
  ============================================================================
  乾融 · 产业数字金融运营平台 — 后台管理系统「通用工作台」DEMO（优化版）
  ----------------------------------------------------------------------------
  设计目标：可实现 / 可落地 / 可复用 / 科技感 / 安全感
  复用方式：只改下方 <script> 里的 CONFIG（品牌·用户·安全）与 DATA（业务数据）
            两个对象即可套用到任意后台系统，视图层与交互层无需改动。
  技术约束：单文件、零依赖、零构建、可离线打开。CSS 全部走设计令牌，无 !important。
  交互范式：多标签工作台 + 分屏对比 + 专注模式 + 命令面板(⌘K) + 详情侧滑 + 安全门禁
  ============================================================================
-->
<style>
/* ==========================================================================
   1. 设计令牌 Design Tokens —— 换肤只改这里
   ========================================================================== */
:root{
  /* 底色与面板 */
  --bg-0:#040914; --bg-1:#06111f; --bg-2:#0a1b33;
  --panel:rgba(11,26,52,.72); --panel-solid:#0b1a34; --panel-2:rgba(15,34,66,.6);
  --line:rgba(96,178,255,.16); --line-strong:rgba(96,178,255,.34);
  /* 品牌强调色 */
  --cyan:#38e0ff; --cyan-soft:#7cd6ff; --gold:#ffd36f; --gold-soft:#ffe6a8;
  --green:#4fe6a8; --amber:#ffb35a; --red:#ff6d8a; --violet:#9d9bff;
  /* 文字 */
  --tx:#eaf5ff; --tx-mut:#a7c1de; --tx-dim:#6f8bab;
  /* 尺寸 */
  --r-sm:10px; --r:14px; --r-lg:18px; --r-xl:22px;
  --sp:12px; --gap:14px;
  --rail:264px; --rail-collapsed:74px; --taskpane:340px; --topbar:64px;
  /* 效果 */
  --blur:14px;
  --shadow:0 24px 70px rgba(0,0,0,.42);
  --shadow-lg:0 40px 120px rgba(0,0,0,.55);
  --glow-cyan:0 0 22px rgba(56,224,255,.18);
  --glow-gold:0 0 22px rgba(255,211,111,.16);
  --ease:.24s cubic-bezier(.4,0,.2,1);
  --mono:"SF Mono",ui-monospace,"JetBrains Mono",Consolas,Menlo,monospace;
  --sans:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,Arial,sans-serif;
}

/* ==========================================================================
   2. 基础 & 背景（科技感：深空底 + 网格 + 辉光）
   ========================================================================== */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--sans);color:var(--tx);overflow:hidden;
  background:
    radial-gradient(1200px 600px at 8% -6%,rgba(56,224,255,.10),transparent 60%),
    radial-gradient(1000px 560px at 96% 0%,rgba(255,211,111,.08),transparent 58%),
    radial-gradient(900px 700px at 50% 120%,rgba(79,230,168,.06),transparent 60%),
    linear-gradient(160deg,var(--bg-0),var(--bg-1) 46%,var(--bg-0));
  -webkit-font-smoothing:antialiased;
}
body::before{ /* 精细网格 */
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(96,178,255,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(96,178,255,.03) 1px,transparent 1px);
  background-size:40px 40px;
  -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.9),rgba(0,0,0,.08));
          mask-image:linear-gradient(to bottom,rgba(0,0,0,.9),rgba(0,0,0,.08));
}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,rgba(56,224,255,.4),rgba(255,211,111,.34));border-radius:9px}
::-webkit-scrollbar-track{background:rgba(96,178,255,.05)}
::selection{background:rgba(56,224,255,.28)}

/* 通用玻璃面板 */
.glass{
  position:relative;border:1px solid var(--line);border-radius:var(--r-lg);
  background:linear-gradient(180deg,var(--panel),rgba(4,12,26,.7));
  backdrop-filter:blur(var(--blur));box-shadow:var(--shadow);
}
.glass::before{ /* 顶部扫描光边 */
  content:"";position:absolute;left:14px;right:14px;top:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--cyan),var(--gold),transparent);
  opacity:.6;
}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.hd h3{margin:0;font-size:14.5px;font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.hd h3::before{content:"";width:4px;height:15px;border-radius:3px;background:linear-gradient(var(--cyan),var(--gold));box-shadow:0 0 10px var(--cyan)}
.hd .tag{font-size:11px;color:var(--cyan-soft);border:1px solid var(--line);padding:3px 9px;border-radius:999px;background:rgba(56,224,255,.06);white-space:nowrap}
.mono{font-family:var(--mono)}

/* ==========================================================================
   3. 骨架
   ========================================================================== */
.app{height:100vh;display:grid;grid-template-rows:var(--topbar) 1fr;position:relative;z-index:1}
.app.focus{--rail:0px;--taskpane:0px}

/* --- 顶栏 --- */
.topbar{
  display:grid;grid-template-columns:auto minmax(180px,360px) 1fr auto;
  align-items:center;gap:16px;padding:0 18px;
  border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(7,18,36,.92),rgba(5,12,26,.72));
  backdrop-filter:blur(var(--blur));position:relative;z-index:20;
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .logo{
  width:36px;height:36px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(135deg,rgba(56,224,255,.25),rgba(255,211,111,.18));
  border:1px solid var(--line-strong);box-shadow:var(--glow-cyan);font-weight:900;color:#fff;font-size:16px;
}
.brand b{font-size:15.5px;font-weight:800;letter-spacing:.3px;white-space:nowrap}
.brand small{display:block;font-size:10.5px;color:var(--tx-dim);letter-spacing:.4px}

/* 全局命令入口 */
.omni{
  display:flex;align-items:center;gap:9px;height:38px;padding:0 12px;cursor:text;
  border:1px solid var(--line);border-radius:11px;background:rgba(4,12,26,.5);
  color:var(--tx-dim);font-size:12.5px;transition:border-color var(--ease),box-shadow var(--ease);
}
.omni:hover{border-color:var(--line-strong);box-shadow:var(--glow-cyan)}
.omni .ic{opacity:.7}
.omni kbd{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--tx-mut);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:rgba(96,178,255,.06)}

/* 安全状态条（安全感核心） */
.secbar{display:flex;align-items:center;gap:6px;justify-content:center;flex-wrap:wrap;overflow:hidden}
.sec-chip{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;
  border:1px solid rgba(79,230,168,.22);border-radius:999px;background:rgba(79,230,168,.06);
  font-size:11.5px;color:#bff0d8;white-space:nowrap;
}
.sec-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 9px var(--green);animation:pulse 2.4s ease-in-out infinite}
.sec-chip.warn{border-color:rgba(255,179,90,.28);background:rgba(255,179,90,.06);color:#ffddb0}
.sec-chip.warn .dot{background:var(--amber);box-shadow:0 0 9px var(--amber)}
.sec-chip b{font-family:var(--mono);color:#eafff5;font-weight:700}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.82)}}

/* 用户 */
.userbox{display:flex;align-items:center;gap:12px}
.perm{text-align:right;line-height:1.3;min-width:0}
.perm b{font-size:12.5px;color:var(--tx)}
.perm span{display:block;font-size:10.5px;color:var(--gold-soft)}
.avatar{width:38px;height:38px;border-radius:12px;flex:0 0 auto;display:grid;place-items:center;font-weight:800;color:#031018;
  background:linear-gradient(135deg,var(--cyan),var(--green));box-shadow:var(--glow-cyan)}

/* --- 主区 --- */
.main{
  display:grid;grid-template-columns:var(--rail) 1fr var(--taskpane);gap:var(--gap);
  padding:var(--gap);min-height:0;transition:grid-template-columns var(--ease);
}

/* ==========================================================================
   4. 左侧导航
   ========================================================================== */
.rail{display:flex;flex-direction:column;min-height:0;padding:14px 12px;overflow:hidden;transition:padding var(--ease)}
.rail .hd{margin-bottom:10px}
.railtools{display:flex;gap:6px;margin-bottom:10px}
.icobtn{
  flex:0 0 auto;width:30px;height:30px;display:grid;place-items:center;cursor:pointer;
  border:1px solid var(--line);border-radius:9px;background:rgba(96,178,255,.05);color:var(--tx-mut);
  transition:all var(--ease);font-size:14px;
}
.icobtn:hover{border-color:var(--line-strong);color:#fff;box-shadow:var(--glow-cyan)}
.icobtn.on{border-color:var(--gold);color:var(--gold);background:rgba(255,211,111,.1)}

.domlist{display:flex;flex-direction:column;gap:7px;flex:0 0 auto}
.dombtn{
  display:flex;align-items:center;gap:11px;text-align:left;cursor:pointer;padding:10px 11px;
  border:1px solid var(--line);border-radius:var(--r);background:rgba(96,178,255,.045);
  color:var(--tx-mut);transition:all var(--ease);
}
.dombtn .di{width:26px;height:26px;flex:0 0 auto;border-radius:8px;display:grid;place-items:center;font-size:14px;
  background:rgba(56,224,255,.08);border:1px solid var(--line)}
.dombtn .dt{min-width:0}
.dombtn .dt b{font-size:13px;font-weight:700;display:block}
.dombtn .dt small{font-size:10.5px;color:var(--tx-dim);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dombtn:hover{border-color:var(--line-strong);transform:translateX(2px)}
.dombtn.active{color:#fff;border-color:var(--gold);background:linear-gradient(120deg,rgba(56,224,255,.14),rgba(255,211,111,.12));box-shadow:var(--glow-gold)}
.dombtn.active .di{background:rgba(255,211,111,.16);border-color:var(--line-strong)}

.railsplit{height:1px;background:var(--line);margin:14px 2px 12px}
.nodescroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:4px;margin-right:-4px}
.layer{margin-bottom:10px}
.layer-hd{
  position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;
  height:28px;padding:0 11px;margin-bottom:6px;border-radius:999px;cursor:pointer;
  border:1px solid rgba(255,211,111,.2);color:var(--gold-soft);font-size:11.5px;font-weight:800;
  background:linear-gradient(90deg,rgba(255,211,111,.14),rgba(56,224,255,.06));
  backdrop-filter:blur(6px);transition:all var(--ease);
}
.layer-hd:hover{border-color:rgba(255,211,111,.4)}
.layer-hd .cnt{font-size:10px;color:var(--tx-mut);font-weight:600;display:flex;align-items:center;gap:5px}
.layer-hd .chev{transition:transform var(--ease)}
.layer.collapsed .chev{transform:rotate(-90deg)}
.layer.collapsed .node{display:none}
.node{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;cursor:pointer;
  padding:8px 10px;margin-bottom:5px;border:1px solid transparent;border-radius:11px;
  color:var(--tx-mut);transition:all var(--ease);font-size:12.5px;background:none;
}
.node .idx{font-family:var(--mono);font-size:10.5px;color:var(--cyan-soft);flex:0 0 auto}
.node .nt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node:hover{border-color:var(--line);background:rgba(96,178,255,.06);color:#fff}
.node.active{border-color:var(--line-strong);background:rgba(56,224,255,.1);color:#fff;box-shadow:inset 2px 0 0 var(--cyan)}

/* 折叠态左栏 */
.app.rail-collapsed{--rail:var(--rail-collapsed)}
.app.rail-collapsed .rail{padding:14px 8px;align-items:center}
.app.rail-collapsed .rail .hd,.app.rail-collapsed .railsplit,
.app.rail-collapsed .dombtn .dt,.app.rail-collapsed .layer-hd .txt,
.app.rail-collapsed .layer-hd .cnt,.app.rail-collapsed .node .nt,
.app.rail-collapsed .nodescroll{display:none}
.app.rail-collapsed .dombtn{justify-content:center;padding:9px}
.app.rail-collapsed .railtools{flex-direction:column}

/* ==========================================================================
   5. 中区工作台（多标签 + 分屏 + 专注）
   ========================================================================== */
.workspace{display:flex;flex-direction:column;min-height:0;padding:0;overflow:hidden}
.tabbar{
  display:flex;align-items:center;gap:6px;padding:9px 10px;flex:0 0 auto;
  border-bottom:1px solid var(--line);overflow-x:auto;
}
.tab{
  display:flex;align-items:center;gap:8px;height:34px;padding:0 8px 0 12px;cursor:pointer;flex:0 0 auto;
  border:1px solid var(--line);border-radius:10px;background:rgba(96,178,255,.045);
  color:var(--tx-mut);font-size:12.5px;transition:all var(--ease);max-width:230px;
}
.tab .tdot{width:6px;height:6px;border-radius:50%;background:var(--cyan);flex:0 0 auto;box-shadow:0 0 8px var(--cyan)}
.tab .tname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .x{width:18px;height:18px;display:grid;place-items:center;border-radius:6px;flex:0 0 auto;opacity:.55;transition:all var(--ease)}
.tab .x:hover{opacity:1;background:rgba(255,109,138,.18);color:var(--red)}
.tab:hover{border-color:var(--line-strong);color:#fff}
.tab.active{color:#fff;border-color:var(--gold);background:linear-gradient(120deg,rgba(56,224,255,.12),rgba(255,211,111,.1));box-shadow:var(--glow-gold)}
.tab.active .tdot{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.tab.split-2{border-style:dashed;border-color:var(--cyan)}
.tabbar .spacer{flex:1}
.wtool{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;height:30px;padding:0 11px;cursor:pointer;
  border:1px solid var(--line);border-radius:9px;background:rgba(96,178,255,.05);
  color:var(--tx-mut);font-size:11.5px;white-space:nowrap;transition:all var(--ease);
}
.wtool:hover{border-color:var(--line-strong);color:#fff;box-shadow:var(--glow-cyan)}
.wtool.on{border-color:var(--gold);color:var(--gold);background:rgba(255,211,111,.1)}

.panes{display:grid;grid-template-columns:1fr;gap:0;flex:1;min-height:0}
.panes.split{grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.pane{overflow-y:auto;overflow-x:hidden;padding:14px;min-height:0;background:transparent;position:relative}
.pane.secondary{background:linear-gradient(180deg,rgba(56,224,255,.02),transparent)}
.pane-flag{position:sticky;top:-14px;z-index:3;margin:-14px -14px 12px;padding:7px 14px;font-size:11px;
  color:var(--cyan-soft);background:rgba(6,17,36,.9);border-bottom:1px solid var(--line);backdrop-filter:blur(6px);display:none}
.panes.split .pane-flag{display:block}

/* 作业头 */
.workhead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px}
.workhead h2{margin:0 0 4px;font-size:18px;font-weight:800;letter-spacing:.3px}
.workhead .sub{font-size:12px;color:var(--cyan-soft)}
.desc{font-size:12px;color:var(--tx-mut);line-height:1.6;margin:0 0 14px;max-width:820px}
.trust{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tbadge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:3px 8px;border-radius:999px;
  border:1px solid rgba(79,230,168,.24);color:#bff0d8;background:rgba(79,230,168,.06)}
.tbadge.gold{border-color:rgba(255,211,111,.26);color:var(--gold-soft);background:rgba(255,211,111,.06)}
.tbadge svg{width:11px;height:11px}

/* KPI —— 左右紧凑布局 */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin-bottom:14px}
.kpi{
  display:flex;align-items:center;gap:11px;padding:10px 12px;position:relative;overflow:hidden;
  border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(135deg,rgba(56,224,255,.07),rgba(255,255,255,.015));
}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--cyan),var(--gold));opacity:.7}
.kpi .kval{font-size:20px;font-weight:800;color:#fff;line-height:1;font-family:var(--mono);margin-left:auto}
.kpi .kmeta{min-width:0}
.kpi .kmeta label{display:block;font-size:11px;color:var(--tx-mut);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .kmeta span{font-size:10px;color:var(--tx-dim)}

/* 流程条 */
.flow{display:flex;gap:8px;align-items:center;overflow-x:auto;padding:4px 0 10px}
.step{
  flex:0 0 auto;min-width:96px;padding:9px 11px;text-align:center;font-size:11.5px;position:relative;
  border:1px solid var(--line);border-radius:12px;background:rgba(56,224,255,.05);color:var(--tx-mut);
}
.step::after{content:"";position:absolute;right:-8px;top:50%;width:8px;height:1px;background:var(--line-strong)}
.step:last-child::after{display:none}
.step.done{border-color:rgba(79,230,168,.5);color:#bff0d8;background:rgba(79,230,168,.06)}
.step.done::before{content:"✓ ";color:var(--green)}
.step.hot{border-color:var(--gold);color:#fff;background:rgba(255,211,111,.1);box-shadow:var(--glow-gold)}

/* 内容网格：作业面板 */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--panel-2)}
.card h4{margin:0 0 9px;font-size:13px;color:var(--cyan);display:flex;align-items:center;gap:7px}
.card h4::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.pill{display:inline-block;font-size:11px;padding:4px 9px;margin:0 4px 5px 0;border-radius:999px;
  border:1px solid var(--line);color:var(--tx-mut);background:rgba(96,178,255,.05)}
.pill:hover{border-color:var(--line-strong);color:#fff}

.matrix{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cell{border:1px solid var(--line);border-radius:11px;padding:9px;background:rgba(96,178,255,.04)}
.cell b{display:block;font-size:12px;color:#dff1ff}
.cell span{display:block;font-size:10.5px;color:var(--tx-mut);margin-top:4px}

/* 漏斗 */
.funnel{display:flex;flex-direction:column;gap:7px}
.frow{display:grid;grid-template-columns:78px 1fr 52px;align-items:center;gap:9px}
.frow b{font-size:11.5px;color:#dff1ff}
.ftrack{height:15px;border-radius:999px;background:rgba(96,178,255,.08);overflow:hidden;border:1px solid var(--line)}
.ffill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--green),var(--cyan),var(--gold))}
.frow span{font-size:11.5px;color:var(--gold);font-weight:800;font-family:var(--mono);text-align:right}

/* 热力 */
.heat{display:grid;grid-template-columns:76px repeat(4,1fr);gap:5px}
.heat div{min-height:32px;display:grid;place-items:center;text-align:center;padding:4px;font-size:10.5px;border-radius:9px;
  border:1px solid var(--line);color:#dbefff;background:rgba(96,178,255,.045)}
.heat .head{background:rgba(13,42,94,.7);font-weight:800;color:#dff6ff}
.heat .ok{background:rgba(79,230,168,.1);color:var(--green);border-color:rgba(79,230,168,.24)}
.heat .mid{background:rgba(56,224,255,.1);color:var(--cyan);border-color:rgba(56,224,255,.24)}
.heat .warn{background:rgba(255,211,111,.1);color:var(--gold);border-color:rgba(255,211,111,.26)}
.heat .risk{background:rgba(255,109,138,.1);color:var(--red);border-color:rgba(255,109,138,.26)}

/* 雷达 */
.radar{display:grid;grid-template-columns:190px 1fr;gap:14px;align-items:center}
.radar-wrap{position:relative;width:180px;height:180px;margin:auto}
.radar-wrap svg{width:100%;height:100%;filter:drop-shadow(0 0 12px rgba(56,224,255,.22))}
.radar-c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;
  display:grid;place-items:center;background:radial-gradient(circle,rgba(79,230,168,.28),rgba(4,12,26,.75));
  border:1px solid rgba(79,230,168,.3);box-shadow:0 0 22px rgba(79,230,168,.16)}
.radar-c b{font-size:22px;color:var(--green);font-family:var(--mono);line-height:1}
.radar-c span{font-size:9.5px;color:#dffff3;font-weight:800;margin-top:3px}
.dna8{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.dna8 .seg{border:1px solid var(--line);border-radius:11px;padding:7px;position:relative;overflow:hidden;background:rgba(96,178,255,.04)}
.dna8 .seg::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--green),var(--cyan))}
.dna8 .seg.warn::after{background:linear-gradient(90deg,var(--gold),var(--amber))}
.dna8 .seg label{display:block;font-size:9.5px;color:var(--tx-mut)}
.dna8 .seg b{display:block;font-size:16px;color:#fff;margin-top:3px;font-family:var(--mono)}
.note{border:1px solid var(--line);border-radius:11px;padding:9px;background:rgba(56,224,255,.04);
  color:var(--tx-mut);font-size:11.5px;line-height:1.6;margin:0 0 10px}

/* 表格 */
.tbl-hd{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}
.tbl-hd h4{margin:0;font-size:13px;color:var(--cyan)}
.tbl-hd .tag{font-size:11px;color:var(--cyan-soft);border:1px solid var(--line);padding:2px 8px;border-radius:999px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{color:var(--cyan-soft);font-weight:600;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line-strong);font-size:11px;letter-spacing:.3px}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);color:var(--tx-mut)}
.tbl tr[data-row]{cursor:pointer;transition:background var(--ease)}
.tbl tr[data-row]:hover td{background:rgba(56,224,255,.05);color:#fff}
.tbl .code{font-family:var(--mono);color:var(--cyan-soft);font-size:11px}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line)}
.st .d{width:6px;height:6px;border-radius:50%}
.st.ok{color:var(--green);border-color:rgba(79,230,168,.3)}.st.ok .d{background:var(--green)}
.st.warn{color:var(--amber);border-color:rgba(255,179,90,.3)}.st.warn .d{background:var(--amber)}
.st.risk{color:var(--red);border-color:rgba(255,109,138,.3)}.st.risk .d{background:var(--red)}
.st.mut{color:var(--cyan);border-color:rgba(56,224,255,.3)}.st.mut .d{background:var(--cyan)}

/* 动作条 */
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:12px;padding:8px 13px;
  border:1px solid var(--line-strong);border-radius:999px;background:rgba(56,224,255,.07);color:#dff7ff;
  transition:all var(--ease);
}
.btn:hover{transform:translateY(-1px);box-shadow:var(--glow-cyan);border-color:var(--cyan)}
.btn.gold{border-color:var(--gold);color:var(--gold);background:rgba(255,211,111,.09)}
.btn.gold:hover{box-shadow:var(--glow-gold)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--tx-mut)}

/* ==========================================================================
   6. 右侧任务 + 安全门禁
   ========================================================================== */
.taskpane{display:flex;flex-direction:column;min-height:0;padding:14px;overflow:hidden}
.taskpane .scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:4px;margin-right:-4px}
.eff{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.effitem{border:1px solid var(--line);border-radius:11px;padding:9px;background:rgba(79,230,168,.045)}
.effitem label{display:block;font-size:10.5px;color:var(--tx-mut)}
.effitem b{display:block;font-size:18px;color:var(--green);font-family:var(--mono);margin-top:3px}
.effitem span{font-size:9.5px;color:var(--tx-dim)}
.task{
  display:grid;grid-template-columns:1fr auto;align-items:center;gap:9px;
  border:1px solid var(--line);border-radius:12px;padding:10px 11px;margin-bottom:8px;
  background:rgba(96,178,255,.045);cursor:pointer;transition:all var(--ease);
}
.task:hover{border-color:var(--line-strong);transform:translateX(-2px)}
.task b{font-size:12.5px;color:var(--tx)}
.task span{font-size:10.5px;color:var(--tx-mut);display:block;margin-top:2px}
.task .bd{font-size:11px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--cyan);white-space:nowrap}
.task.warn{border-left:3px solid var(--amber)}.task.warn .bd{color:var(--amber);border-color:rgba(255,179,90,.3)}
.task.danger{border-left:3px solid var(--red)}.task.danger .bd{color:var(--red);border-color:rgba(255,109,138,.3)}
.task.ok{border-left:3px solid var(--green)}.task.ok .bd{color:var(--green);border-color:rgba(79,230,168,.3)}

/* 安全合规门禁 */
.gate{border:1px solid rgba(79,230,168,.24);border-radius:var(--r);padding:12px;margin-top:12px;
  background:radial-gradient(circle at 100% 0,rgba(79,230,168,.1),transparent 40%),rgba(6,20,40,.5)}
.gate-hd{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.gate-hd .shield{width:30px;height:30px;flex:0 0 auto;border-radius:9px;display:grid;place-items:center;
  background:rgba(79,230,168,.14);border:1px solid rgba(79,230,168,.3);color:var(--green)}
.gate-hd b{font-size:13px;color:#dff1ff}
.gate-hd small{display:block;font-size:10px;color:var(--green)}
.gate-list{display:flex;flex-direction:column;gap:6px}
.gate-item{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--tx-mut)}
.gate-item .c{width:16px;height:16px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font-size:10px;
  background:rgba(79,230,168,.14);color:var(--green);border:1px solid rgba(79,230,168,.3)}
.gate-item .val{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--green)}

.foldbtn{width:100%;margin-top:10px;padding:9px;cursor:pointer;font-size:11.5px;color:var(--tx-mut);
  border:1px dashed var(--line);border-radius:11px;background:transparent;transition:all var(--ease)}
.foldbtn:hover{border-color:var(--line-strong);color:#fff}

/* ==========================================================================
   7. 详情侧滑 / 命令面板 / toast
   ========================================================================== */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(2,7,16,.55);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity var(--ease)}
.scrim.show{opacity:1;pointer-events:auto}

.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(560px,92vw);z-index:50;padding:20px;overflow-y:auto;
  border-left:1px solid var(--line-strong);border-radius:var(--r-xl) 0 0 var(--r-xl);
  background:linear-gradient(160deg,rgba(9,24,50,.98),rgba(4,11,26,.98));backdrop-filter:blur(var(--blur));
  box-shadow:var(--shadow-lg);transform:translateX(102%);transition:transform var(--ease);
}
.drawer.show{transform:none}
.drawer .dclose{position:absolute;top:16px;right:18px}
.drawer h2{margin:0 0 6px;font-size:19px;font-weight:800;padding-right:70px}
.drawer .dmeta{font-size:12px;color:var(--cyan-soft);margin-bottom:16px}
.kv{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:16px}
.kv td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.kv td:first-child{color:var(--tx-dim);width:120px}
.kv td:last-child{color:var(--tx)}
.audit{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--panel-2);margin-bottom:16px}
.audit h4{margin:0 0 10px;font-size:12.5px;color:var(--cyan)}
.trace{position:relative;padding-left:18px}
.trace::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:1px;background:var(--line-strong)}
.trace .ev{position:relative;padding:0 0 12px 0;font-size:11.5px;color:var(--tx-mut)}
.trace .ev::before{content:"";position:absolute;left:-16px;top:4px;width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.trace .ev:last-child{padding-bottom:0}
.trace .ev b{color:var(--tx);font-weight:600}
.trace .ev time{display:block;font-family:var(--mono);font-size:10px;color:var(--tx-dim);margin-top:2px}

/* 命令面板 */
.palette{position:fixed;left:50%;top:14vh;transform:translateX(-50%) scale(.97);width:min(620px,92vw);z-index:60;
  border:1px solid var(--line-strong);border-radius:var(--r-lg);overflow:hidden;
  background:linear-gradient(180deg,rgba(9,22,46,.98),rgba(5,12,26,.98));backdrop-filter:blur(var(--blur));
  box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity var(--ease),transform var(--ease)}
.palette.show{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1)}
.palette input{width:100%;border:0;outline:0;background:transparent;color:var(--tx);font-size:15px;padding:16px 18px;
  border-bottom:1px solid var(--line);font-family:var(--sans)}
.palette input::placeholder{color:var(--tx-dim)}
.presults{max-height:52vh;overflow-y:auto;padding:8px}
.pitem{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;cursor:pointer;color:var(--tx-mut)}
.pitem .pk{font-size:10px;padding:2px 7px;border-radius:6px;border:1px solid var(--line);color:var(--cyan-soft);flex:0 0 auto}
.pitem .pn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem small{color:var(--tx-dim);font-size:10.5px}
.pitem.sel,.pitem:hover{background:rgba(56,224,255,.1);color:#fff}
.pfoot{display:flex;gap:14px;padding:9px 16px;border-top:1px solid var(--line);font-size:10.5px;color:var(--tx-dim)}
.pfoot kbd{font-family:var(--mono);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-right:4px}

/* toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(16px);z-index:70;opacity:0;
  display:flex;align-items:center;gap:9px;padding:11px 18px;border-radius:999px;pointer-events:none;
  border:1px solid var(--line-strong);background:rgba(6,18,38,.96);backdrop-filter:blur(var(--blur));
  color:#fff;font-size:13px;box-shadow:var(--shadow);transition:all var(--ease)}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast .ti{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green)}

/* 安全水印（安全感） */
.watermark{position:fixed;right:16px;bottom:12px;z-index:5;pointer-events:none;font-size:10px;
  color:rgba(167,193,222,.28);font-family:var(--mono);letter-spacing:.5px;text-align:right;line-height:1.5}

/* ==========================================================================
   8. 响应式
   ========================================================================== */
.mobtask{display:none}
@media(max-width:1280px){
  :root{--rail:220px;--taskpane:300px}
  .secbar{display:none}
}
@media(max-width:1040px){
  .main{grid-template-columns:var(--rail) 1fr;--taskpane:0px}
  .taskpane{position:fixed;top:0;right:0;bottom:0;width:min(360px,92vw);z-index:50;border-radius:var(--r-xl) 0 0 var(--r-xl);
    border-left:1px solid var(--line-strong);transform:translateX(102%);transition:transform var(--ease);background:linear-gradient(160deg,rgba(9,24,50,.98),rgba(4,11,26,.98))}
  .taskpane.show{transform:none}
  .mobtask{display:inline-flex}
  .omni{display:none}
  .topbar{grid-template-columns:auto 1fr auto}
}
@media(max-width:720px){
  .app.rail-collapsed{--rail:0px}
  .main{grid-template-columns:1fr}
  .rail{position:fixed;top:0;left:0;bottom:0;width:min(280px,86vw);z-index:50;transform:translateX(-102%);
    transition:transform var(--ease);background:linear-gradient(160deg,rgba(9,24,50,.98),rgba(4,11,26,.98))}
  .rail.show{transform:none}
  .grid2{grid-template-columns:1fr}.radar{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ======================= 顶栏 ======================= -->
  <header class="topbar">
    <div class="brand">
      <button class="icobtn mobtask" id="mRail" title="菜单" style="margin-right:2px">☰</button>
      <div class="logo">乾</div>
      <div><b id="brandName">乾融 · 产业数字金融运营平台</b><small id="brandSub">Industrial Digital Finance Operating Platform</small></div>
    </div>

    <div class="omni" id="omni" title="⌘K / Ctrl+K">
      <span class="ic">⌕</span><span>搜索平台入口、业务节点、作业对象…</span><kbd>⌘K</kbd>
    </div>

    <div class="secbar" id="secbar"></div>

    <div class="userbox">
      <button class="icobtn mobtask" id="mTask" title="任务中心">☷</button>
      <div class="perm"><b id="userName">运营负责人</b><span id="userScope">融资运营 / 银行协同 / 风险复核</span></div>
      <div class="avatar" id="userAvatar">泰</div>
    </div>
  </header>

  <!-- ======================= 主区 ======================= -->
  <main class="main">

    <!-- 左侧导航 -->
    <aside class="rail glass" id="rail">
      <div class="hd"><h3>业务域</h3><span class="tag" id="domCount">5/5</span></div>
      <div class="railtools">
        <button class="icobtn" id="railCollapse" title="收起侧栏">⇤</button>
        <button class="icobtn" id="lockLayers" title="展开全部五层节点">⇅</button>
      </div>
      <div class="domlist" id="domList"></div>
      <div class="railsplit"></div>
      <div class="hd"><h3 id="curDomLabel">节点</h3><span class="tag">五层常驻</span></div>
      <div class="nodescroll" id="nodeMenu"></div>
    </aside>

    <!-- 中区工作台 -->
    <section class="workspace glass" id="workspace">
      <div class="tabbar" id="tabbar"></div>
      <div class="panes" id="panes">
        <div class="pane" id="paneA"></div>
        <div class="pane secondary" id="paneB" style="display:none"></div>
      </div>
    </section>

    <!-- 右侧任务 + 门禁 -->
    <aside class="taskpane glass" id="taskpane">
      <div class="hd"><h3>综合任务中心</h3><span class="tag">调度中枢</span></div>
      <div class="scroll" id="taskScroll"></div>
    </aside>

  </main>
</div>

<!-- 侧滑详情 / 遮罩 / 命令面板 / toast -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>
<div class="palette" id="palette">
  <input id="paletteInput" placeholder="输入以跳转：平台入口 · 业务节点 · 作业对象 · 命令…" autocomplete="off"/>
  <div class="presults" id="paletteResults"></div>
  <div class="pfoot"><span><kbd>↑↓</kbd>选择</span><span><kbd>↵</kbd>打开</span><span><kbd>esc</kbd>关闭</span></div>
</div>
<div class="toast" id="toast"><span class="ti"></span><span id="toastMsg"></span></div>
<div class="watermark" id="watermark"></div>

<script>
/* ============================================================================
   A. 可复用配置区 —— 换系统只改 CONFIG 与 DATA
   ============================================================================ */
const CONFIG = {
  brand:{ name:"乾融 · 产业数字金融运营平台", sub:"Industrial Digital Finance Operating Platform", logo:"乾" },
  user:{ name:"运营负责人（泰乾数科）", scope:"融资运营 / 银行协同 / 风险复核", avatar:"泰" },
  // 安全状态条：真实系统可对接后端安全态势接口
  security:[
    { label:"传输加密", value:"TLS 1.3", type:"ok" },
    { label:"链上存证", value:"同步中", type:"ok" },
    { label:"审计留痕", value:"实时", type:"ok" },
    { label:"权限校验", value:"RBAC", type:"ok" }
  ],
  sessionMinutes: 30, // 会话安全倒计时
  // 合规安全门禁：真实系统可对接合规校验/等保结果
  gate:[
    { k:"权限校验", v:"通过" },
    { k:"数据加密", v:"AES-256" },
    { k:"操作审计", v:"已留痕" },
    { k:"敏感操作双确认", v:"已启用" },
    { k:"链上存证同步", v:"100%" },
    { k:"会话安全", v:"正常" }
  ]

  if(!t){ t={id:++tabSeq,domain,entry}; state.tabs.push(t); if(state.tabs.length>8) state.tabs.splice(0,1); }
  state.activeId=t.id;
  renderWorkspace();
  if(!silent) toast('已在工作台打开：'+domain+' / '+entry);
}
function closeTab(id){
  const i=state.tabs.findIndex(t=>t.id===id); if(i<0)return;
  if(state.splitId===id) state.splitId=null;
  state.tabs.splice(i,1);
  if(state.activeId===id) state.activeId=(state.tabs[i]||state.tabs[i-1]||state.tabs[0]||{}).id||null;
  renderWorkspace();
}
function toggleSplit(){
  if(state.splitId){ state.splitId=null; toast('已退出分屏对比'); }
  else{
    const others=state.tabs.filter(t=>t.id!==state.activeId);
    if(!others.length){ toast('至少再打开一个标签才能分屏对比'); return; }
    state.splitId=others[others.length-1].id; toast('已进入分屏对比（左右对照）');
  }
  renderTabs(); renderPanes();
}
function toggleFocus(){
  state.focus=!state.focus;

document.addEventListener('click',e=>{
  const t=e.target;
  const closest=(s)=>t.closest&&t.closest(s);
  let n;
  // 左栏业务域
  if((n=closest('[data-domain]'))){ openTab(n.dataset.domain); return; }
  // 折叠某一层
  if((n=closest('[data-toggle-layer]'))){ const k=n.dataset.toggleLayer; collapsedLayers.has(k)?collapsedLayers.delete(k):collapsedLayers.add(k); renderRail(); return; }
  // 打开节点
  if((n=closest('[data-open]'))){ const [dm,en]=n.dataset.open.split('|'); openTab(dm,en); return; }
  // 标签关闭 / 切换（关闭优先）
  if((n=closest('[data-closetab]'))){ e.stopPropagation(); closeTab(+n.dataset.closetab); return; }
  if((n=closest('[data-tab]'))){ state.activeId=+n.dataset.tab; renderWorkspace(); return; }
  // 表格行 → 详情
  if((n=closest('[data-row]'))){ const [dm,i]=n.dataset.row.split('|'); const r=DATA.domain[dm].table[+i];
    openDrawer(r[0]+' · 作业详情', dm+' / '+r[1], [['对象编号',r[0]],['节点状态',r[1]],['关键字段',r[2]],['下一步',r[3]],['数据安全','AES-256 · 链上存证已生成']]); return; }
  // 动作按钮
  if((n=closest('[data-action]'))){ const [a,dm,en]=n.dataset.action.split('|'); openDrawer(a, (dm||'')+(en?' / '+en:'')); return; }
  // 任务卡
  if((n=closest('[data-task]'))){ openDrawer(n.dataset.task,'综合任务中心 / '+state.platform); return; }
  // 命令面板项
  if((n=closest('[data-pi]'))){ runPalette(+n.dataset.pi); return; }
  // toast 类
  if((n=closest('[data-toast]'))){ toast(n.dataset.toast); return; }
  // 工具/图标按钮（按 id）
  switch(t.id){
    case 'splitBtn': toggleSplit(); break;
    case 'focusBtn': toggleFocus(); break;
    case 'drawerClose': closeOverlays(); break;
    case 'refreshTasks': renderTasks(); toast('已按业务域刷新任务'); break;
    case 'gateReport': openDrawer('合规安全自检报告','安全合规门禁', CONFIG.gate.map(g=>[g.k,g.v]).concat([['等保定级','三级'],['数据分类分级','已标注'],['最近渗透测试','通过']])); break;
    case 'railCollapse': $('app').classList.toggle('rail-collapsed'); break;
    case 'lockLayers': collapsedLayers.clear(); renderRail(); toast('五层节点已全部展开'); break;
    case 'omni': openPalette(); break;
    case 'mRail': $('rail').classList.toggle('show'); $('scrim').classList.toggle('show'); break;
    case 'mTask': $('taskpane').classList.toggle('show'); $('scrim').classList.toggle('show'); break;
    case 'scrim': closeOverlays(); break;
  }
});

// 命令面板输入 & 键盘
$('paletteInput').addEventListener('input',e=>filterPalette(e.target.value));
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openPalette(); return; }
  if(e.key==='Escape'){ closeOverlays(); return; }
  if($('palette').classList.contains('show')){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault();
      paletteSel=Math.max(0,Math.min(paletteItems.length-1,paletteSel+(e.key==='ArrowDown'?1:-1)));
      els('.pitem').forEach((x,i)=>x.classList.toggle('sel',i===paletteSel));
      els('.pitem')[paletteSel]?.scrollIntoView({block:'nearest'});
    }
    if(e.key==='Enter'){ e.preventDefault(); runPalette(paletteSel); }
  }
});

/* ============================================================================
   H. 图标 SVG（内联，避免外链，符合安全 CSP）
   ============================================================================ */
function shieldSvg(s=11){return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>`}
function chainSvg(s=11){return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>`}
function radarSvg(){return `<svg viewBox="0 0 200 200"><polygon points="100,14 164,36 186,100 164,164 100,186 36,164 14,100 36,36" fill="none" stroke="rgba(96,178,255,.26)"/><polygon points="100,42 141,59 158,100 140,140 100,160 58,141 39,100 59,58" fill="none" stroke="rgba(96,178,255,.16)"/><polygon points="100,54 135,66 153,100 132,135 100,149 65,134 52,100 69,65" fill="rgba(79,230,168,.32)" stroke="#33ffe0" stroke-width="2"/><line x1="100" y1="14" x2="100" y2="186" stroke="rgba(96,178,255,.12)"/><line x1="14" y1="100" x2="186" y2="100" stroke="rgba(96,178,255,.12)"/><line x1="36" y1="36" x2="164" y2="164" stroke="rgba(96,178,255,.12)"/><line x1="164" y1="36" x2="36" y2="164" stroke="rgba(96,178,255,.12)"/></svg>`}

/* ============================================================================
   I. 启动
   ============================================================================ */
function boot(){
  renderChrome();
  startSessionClock();
  routePlatform('工作台');          // 默认联动 → 打开首个作业标签
}
boot();
